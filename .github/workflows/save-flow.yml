name: Save flow checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sor7ed_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sor7ed_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SOR7ED_TEST_ADMIN_URL: postgresql://sor7ed_test:local-test-only@127.0.0.1:5432/postgres
      SOR7ED_TEST_DATABASE_URL: postgresql://sor7ed_test:local-test-only@127.0.0.1:5432/sor7ed_save_tests
      SOR7ED_CONNECTION_TEST_DATABASE_URL: postgresql://sor7ed_test:local-test-only@127.0.0.1:5432/sor7ed_connect_tests
      SOR7ED_API_TEST_DATABASE_URL: postgresql://sor7ed_test:local-test-only@127.0.0.1:5432/sor7ed_api_tests
      SOR7ED_LEAN_TEST_DATABASE_URL: postgresql://sor7ed_test:local-test-only@127.0.0.1:5432/sor7ed_lean_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/create-save-test-databases.mjs
      - run: npm test
      - run: npm run test:lean
      - run: npm run test:extension
      - run: npm run test:widget
      - run: npm run typecheck
      - run: npm run build
